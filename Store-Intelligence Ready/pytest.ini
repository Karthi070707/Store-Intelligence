[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short

[coverage:run]
concurrency = thread, greenlet
source = app
omit =
    app/__init__.py
    app/middleware/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    logger\.(debug|info|warning|error)
