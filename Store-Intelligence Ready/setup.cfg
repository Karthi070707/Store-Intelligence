# Store Intelligence — Setup Configuration

[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short

[coverage:run]
branch = true
source = app
concurrency = thread, greenlet
omit =
    app/__init__.py
    app/middleware/__init__.py

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    raise NotImplementedError
    if __name__ == .__main__.:
    pass
    ^\s+pass$
    ^\s+\.\.\.
    @(abc\.)?abstractmethod
show_missing = true
precision = 1
